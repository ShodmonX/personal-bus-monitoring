name: personal-bus-monitor

services:
  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "512mb"
    mem_limit: "2g"
    cpus: 1.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    environment:
      MONITOR_API_KEY: ${MONITOR_API_KEY:?Set MONITOR_API_KEY in .env}
      MAX_ACTIVE_STOPS: "1"
      SCRAPE_INTERVAL_SECONDS: "30"
      STOPS_FILE: /app/stops.json
      DEBUG_DIR: /app/debug
      TZ: Asia/Tashkent
    volumes:
      - ./debug:/app/debug
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: "256m"
    cpus: 0.35
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?Set TELEGRAM_ALLOWED_USER_ID in .env}
      MONITOR_API_KEY: ${MONITOR_API_KEY:?Set MONITOR_API_KEY in .env}
      MONITOR_URL: http://monitor:8099
      NOTIFY_INTERVAL_SECONDS: "60"
      STOPS_FILE: /app/stops.json
      TZ: Asia/Tashkent
    depends_on:
      monitor:
        condition: service_healthy
    networks: [private]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  private:
    driver: bridge
    # No ports are published; both containers still need outbound Internet access.
